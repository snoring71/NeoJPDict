[package]
name = "neojp-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
encoding_rs = "0.8.44"
flate2 = "1.1.10"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
