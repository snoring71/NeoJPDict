[package]
name = "neojpdict"
version = "0.1.0"
description = "Japanese dictionary reader for EPWING and Yomitan dictionaries"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "neojpdict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
neojp-core = { path = "../crates/neojp-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
